# =============================================================================
# nginx/cors-proxy.conf
#
# cz-js-1030 FIX: NGINX Sidecar CORS Proxy Configuration
# Remediation: NGINX Sidecar CORS Proxy in ECS Fargate Task Definition
#
# This NGINX configuration is used by the NGINX sidecar container that runs
# alongside the React frontend container in the same ECS Fargate task.
# Because both containers share the same network namespace (localhost), the
# React app can call http://localhost:8081/proxy/... without triggering
# browser same-origin policy restrictions.
#
# NGINX proxies the request to the external API and injects the required
# CORS response headers so the browser never sees a cross-origin response.
#
# ECS Fargate Task Definition — sidecar container definition (excerpt):
#   {
#     "name": "cors-proxy",
#     "image": "nginx:alpine",
#     "portMappings": [{ "containerPort": 8081, "protocol": "tcp" }],
#     "mountPoints": [{
#       "sourceVolume": "nginx-cors-config",
#       "containerPath": "/etc/nginx/conf.d/default.conf",
#       "readOnly": true
#     }],
#     "essential": false
#   }
#
# Required ECS Fargate task-definition environment variable (React container):
#   REACT_APP_CORS_PROXY_URL=http://localhost:8081/proxy
# =============================================================================

server {
    listen 8081;
    server_name localhost;

    # ------------------------------------------------------------------
    # /proxy/ — reverse-proxy to the external cross-origin API.
    # All CORS response headers are added here so the browser treats the
    # response as same-origin (it comes from localhost:8081, not the
    # external API host).
    # ------------------------------------------------------------------
    location /proxy/ {
        # Strip the /proxy prefix before forwarding to the upstream API.
        # Replace the value below with the actual external API base URL.
        # In production this should be injected via an environment variable
        # using the envsubst pattern in the NGINX entrypoint.
        proxy_pass http://api.other-origin.com/;

        # ---- CORS headers ------------------------------------------------
        # Allow the React container (same Fargate task, localhost) to call
        # this proxy without browser CORS rejections.
        add_header 'Access-Control-Allow-Origin'  '$http_origin'                        always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS'     always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true'                            always;

        # Handle pre-flight OPTIONS requests immediately without forwarding
        # them to the upstream API.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '$http_origin'                        always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS'     always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # ---- Proxy settings ----------------------------------------------
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Remove upstream CORS headers to avoid duplicate header conflicts.
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ------------------------------------------------------------------
    # Health check endpoint for the NGINX sidecar container itself.
    # ECS Fargate health checks can target GET /health on port 8081.
    # ------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 '{"status":"UP","service":"cors-proxy"}';
        add_header Content-Type application/json;
    }
}
