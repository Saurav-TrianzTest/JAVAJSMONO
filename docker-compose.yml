version: "3.9"

# =============================================================================
# docker-compose.yml — react-nextjs-host (application only)
# External services (databases, caches, message queues) are NOT included here.
# Connect them via environment variables below.
# =============================================================================

services:
  react-nextjs-host:
    image: react-nextjs-host:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-nextjs-host
    ports:
      - "8080:8080"
    environment:
      # JVM tuning
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx512m -XX:+ExitOnOutOfMemoryError"
      TZ: "UTC"
      # External service connections — override at runtime as needed
      # DATABASE_URL: "jdbc:postgresql://db-host:5432/mydb"
      # REDIS_HOST: "redis-host"
      # KAFKA_BOOTSTRAP_SERVERS: "kafka-host:9092"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
