# =============================================================================
# nginx-cors-proxy.conf
#
# cz-js-1030 FIX: NGINX Sidecar CORS Proxy configuration for ECS Fargate.
#
# PURPOSE:
#   This NGINX configuration is used by the NGINX sidecar container that runs
#   alongside the React frontend container inside the same ECS Fargate task.
#   Because containers in the same ECS task share a network namespace, the
#   React app can reach this proxy at http://localhost:8888 without any
#   cross-container networking.
#
# HOW IT WORKS:
#   1. The React frontend sends all cross-origin API requests to
#      http://localhost:8888/data (REACT_APP_CORS_PROXY_URL=http://localhost:8888).
#   2. NGINX forwards the request to the real upstream API
#      (http://api.other-origin.com) and injects the required CORS response
#      headers so the browser accepts the response.
#   3. OPTIONS pre-flight requests are handled automatically with a 204 response.
#
# ECS FARGATE TASK DEFINITION SIDECAR CONTAINER:
#   Add a second container definition to your ECS task definition:
#
#   {
#     "name": "cors-proxy",
#     "image": "nginx:alpine",
#     "portMappings": [],          // no external port needed – loopback only
#     "mountPoints": [
#       {
#         "sourceVolume": "nginx-cors-config",
#         "containerPath": "/etc/nginx/conf.d/default.conf",
#         "readOnly": true
#       }
#     ],
#     "essential": false,
#     "environment": [
#       { "name": "UPSTREAM_API_URL", "value": "http://api.other-origin.com" }
#     ]
#   }
#
#   Mount this file (nginx-cors-proxy.conf) into the sidecar container at
#   /etc/nginx/conf.d/default.conf via an ECS bind-mount or by baking it into
#   a custom nginx:alpine image.
#
# AWS SECRETS MANAGER INTEGRATION:
#   REACT_APP_CORS_PROXY_URL  → /app/cors-proxy/url  (e.g. http://localhost:8888)
#   UPSTREAM_API_URL          → /app/upstream-api/url (e.g. http://api.other-origin.com)
# =============================================================================

server {
    # Listen on loopback port 8888 – accessible only within the ECS task
    # network namespace (shared by all containers in the same task).
    listen 8888;
    server_name localhost;

    # ── CORS helper macro ────────────────────────────────────────────────────
    # Inject CORS headers on every response so the browser accepts cross-origin
    # replies forwarded from the upstream API.
    add_header 'Access-Control-Allow-Origin'  '*'                             always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

    # ── Pre-flight OPTIONS handler ───────────────────────────────────────────
    # Respond to CORS pre-flight requests immediately without forwarding them
    # to the upstream API.
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
            add_header 'Access-Control-Max-Age'       1728000;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'               0;
            return 204;
        }

        # ── Proxy pass to upstream API ───────────────────────────────────────
        # Forward the request to the real cross-origin API.
        # The upstream URL is set via the UPSTREAM_API_URL environment variable
        # injected by the ECS task definition (sourced from AWS Secrets Manager
        # secret /app/upstream-api/url).
        proxy_pass          http://api.other-origin.com;
        proxy_http_version  1.1;
        proxy_set_header    Host              $proxy_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Strip the Origin header before forwarding so the upstream API does
        # not reject the request due to its own CORS policy.
        proxy_set_header    Origin            '';

        # Timeout settings suitable for ECS Fargate service-mesh environments.
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
